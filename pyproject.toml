[project]
name = "ahg"
version = "0.1.0"
description = "Learned heuristics for A* search over attack graphs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.15.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ahg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
